<app-navbar></app-navbar>

<h2>Admin Dashboard</h2>

<h3>Teams</h3>
<table>
  <tr><th>Name</th><th>Actions</th></tr>
  <tr *ngFor="let t of teams">
    <td>{{ t.teamName }}</td>
    <td *ngIf="role === 'ADMIN'">
      <button (click)="deleteTeam(t.teamId)">Delete</button>
    </td>
  </tr>
</table>

<h3>Cricketers</h3>
<table>
  <tr><th>Name</th><th>Actions</th></tr>
  <tr *ngFor="let c of cricketers">
    <td>{{ c.cricketerName }}</td>
    <td *ngIf="role === 'ADMIN'">
      <button (click)="deleteCricketer(c.cricketerId)">Delete</button>
    </td>
  </tr>
</table>

<h3>Matches</h3>
<table>
  <tr><th>Venue</th><th>Actions</th></tr>
  <tr *ngFor="let m of matches">
    <td>{{ m.venue }}</td>
    <td *ngIf="role === 'ADMIN'">
      <button (click)="deleteMatch(m.matchId)">Delete</button>
    </td>
  </tr>
</table>

<h3>Votes</h3>
<ul>
  <li *ngFor="let v of votes">{{ v.category }}</li>
</ul>

<h3>Ticket Bookings</h3>
<ul>
  <li *ngFor="let b of bookings">Match: {{ b.matchId }}</li>
</ul>
