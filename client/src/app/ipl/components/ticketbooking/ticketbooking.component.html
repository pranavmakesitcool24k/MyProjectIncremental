<h2>Ticket Booking</h2>

<form [formGroup]="ticketBookingForm" (ngSubmit)="onSubmit()">

  <input type="email" placeholder="Email" formControlName="email" />

  <select formControlName="match">
    <option [ngValue]="null">Select Match</option>
    <option *ngFor="let m of matches" [ngValue]="m">
      {{ m.matchId }} - {{ m.venue }}
    </option>
  </select>

  <input type="number" placeholder="Number Of Tickets" formControlName="numberOfTickets" />

  <button type="submit">Book</button>
  <button type="button" (click)="resetForm()">Reset</button>
</form>

<p *ngIf="successMessage">{{ successMessage }}</p>
<p *ngIf="errorMessage">{{ errorMessage }}</p>
